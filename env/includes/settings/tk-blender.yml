# Settings for the community Blender engine (tk-blender), bundled with this
# config under bundles/tk-blender. See bundles/tk-blender/README_VEXS.md.
#
################################################################################

includes:
- ../app_locations.yml
- ../engine_locations.yml
- ../software_paths.yml
- ./tk-multi-breakdown.yml
- ./tk-multi-loader2.yml
- ./tk-multi-publish2.yml
- ./tk-multi-screeningroom.yml
- ./tk-multi-setframerange.yml
- ./tk-multi-shotgunpanel.yml
- ./tk-multi-snapshot.yml
- ./tk-multi-workfiles2.yml

################################################################################

# asset
settings.tk-blender.asset:
  apps:
    tk-multi-about:
      location: "@apps.tk-multi-about.location"
    tk-multi-screeningroom: "@settings.tk-multi-screeningroom.rv"
    tk-multi-shotgunpanel: "@settings.tk-multi-shotgunpanel"
    tk-multi-workfiles2: "@settings.tk-multi-workfiles2.blender"
  menu_favourites:
  - {app_instance: tk-multi-workfiles2, name: File Open...}
  # workfiles2 only supports launch_at_startup for a few engines, so the
  # engine opens the dialog instead
  run_at_startup:
  - {app_instance: tk-multi-workfiles2, name: File Open...}
  pyside_python_path: "@path.windows.blender_pyside"
  location: "@engines.tk-blender.location"

# asset_step
settings.tk-blender.asset_step:
  apps:
    tk-multi-about:
      location: "@apps.tk-multi-about.location"
    tk-multi-breakdown: "@settings.tk-multi-breakdown.blender"
    tk-multi-loader2: "@settings.tk-multi-loader2.blender"
    tk-multi-publish2: "@settings.tk-multi-publish2.blender.asset_step"
    tk-multi-pythonconsole:
      location: "@apps.tk-multi-pythonconsole.location"
    tk-multi-screeningroom: "@settings.tk-multi-screeningroom.rv"
    tk-multi-shotgunpanel: "@settings.tk-multi-shotgunpanel"
    tk-multi-snapshot: "@settings.tk-multi-snapshot.blender.asset_step"
    tk-multi-workfiles2: "@settings.tk-multi-workfiles2.blender.asset_step"
  menu_favourites:
  - {app_instance: tk-multi-workfiles2, name: File Open...}
  - {app_instance: tk-multi-snapshot, name: Snapshot...}
  - {app_instance: tk-multi-workfiles2, name: File Save...}
  - {app_instance: tk-multi-publish2, name: Publish...}
  template_project: asset_work_area_blender
  pyside_python_path: "@path.windows.blender_pyside"
  location: "@engines.tk-blender.location"

